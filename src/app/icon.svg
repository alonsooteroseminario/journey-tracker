<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- blue rounded background -->
  <rect width="32" height="32" rx="7" fill="#3B82F6"/>

  <!-- antenna dot -->
  <circle cx="16" cy="3.5" r="2.2" fill="white"/>
  <!-- antenna stem -->
  <rect x="15.2" y="5.5" width="1.6" height="3" rx="0.8" fill="white"/>

  <!-- robot head -->
  <rect x="4" y="8.5" width="24" height="14" rx="6" fill="white"/>

  <!-- eyes -->
  <circle cx="11" cy="14.5" r="2.2" fill="#3B82F6"/>
  <circle cx="21" cy="14.5" r="2.2" fill="#3B82F6"/>

  <!-- smile -->
  <path d="M11 18.5Q16 21.5 21 18.5" stroke="#3B82F6" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
